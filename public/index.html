<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101012" />
    <title>绘梦后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-orange"></div>
    <div class="ambient ambient-blue"></div>

    <header class="site-header">
      <a class="brand" href="#menu" id="brand-link" aria-label="返回绘梦后台首页">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>绘梦<span class="brand-dot">·</span>后台</span>
      </a>
      <div class="header-status"><span class="status-dot"></span> ONLINE</div>
    </header>

    <main class="shell">
      <section class="view" id="menu-view" aria-labelledby="menu-title">
        <div class="eyebrow"><span></span> HUIMENG ADMIN</div>
        <h1 id="menu-title">绘梦后台</h1>
        <p class="page-copy">选择一个功能开始管理。</p>

        <div class="menu-grid" aria-label="后台功能菜单">
          <button class="menu-item" id="activation-menu" type="button">
            <span class="menu-icon activation-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3.2"/><path d="m10.5 10.5 9 9M15 15l2-2m-5-1 2-2"/></svg>
            </span>
            <span class="menu-label">激活码管理</span>
            <span class="menu-arrow" aria-hidden="true">→</span>
          </button>
          <button class="menu-item placeholder-item" id="image-code-menu" type="button" aria-label="出图授权码管理，功能即将开放">
            <span class="menu-icon image-code-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 15l2.5-3 2 2 1.5-2 2 3M8 9h.01"/></svg>
            </span>
            <span class="menu-label">出图授权码管理</span>
            <span class="menu-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <section class="view hidden" id="codes-view" aria-labelledby="codes-title">
        <button class="back-button" id="back-button" type="button">← <span>返回菜单</span></button>
        <div class="page-heading">
          <div>
            <div class="eyebrow"><span></span> DATABASE QUERY</div>
            <h1 id="codes-title">激活码管理</h1>
            <p class="page-copy"><span id="table-name">hm_activation_code</span> · 最近 100 条记录</p>
          </div>
          <span class="heading-mark" aria-hidden="true">⌁</span>
        </div>

        <div class="filter-card">
          <label>激活码<input id="code-filter" placeholder="请输入激活码" /></label>
          <label>设备标识<input id="device-filter" placeholder="请输入设备标识" /></label>
          <label>状态<select id="status-filter"><option value="">全部状态</option><option value="0">未激活</option><option value="1">已激活</option><option value="2">已禁用</option></select></label>
          <div class="filter-actions"><button class="primary-button" id="search-button" type="button">⌕ 搜索</button><button class="ghost-button" id="reset-button" type="button">↺ 重置</button></div>
        </div>

        <div class="data-card">
          <div class="toolbar"><button class="primary-button" id="generate-button" type="button">＋ 生成激活码</button><button class="ghost-button" id="copy-button" type="button">▣ 复制未激活码</button></div>
          <div class="table-wrap">
            <table>
              <thead id="code-head"></thead>
              <tbody id="code-body"></tbody>
            </table>
            <div class="empty-state" id="empty-state">正在连接数据库…</div>
          </div>
          <div class="data-footer">
            <span id="result-count">等待查询</span><div class="pagination"><button id="prev-page" type="button">←</button><span id="page-number">第 1 页</span><button id="next-page" type="button">→</button><select id="page-size"><option>10</option><option>20</option><option>50</option></select><button class="refresh-button" id="refresh-button" type="button">↻ 刷新</button></div>
          </div>
          <p class="notice" id="notice" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <dialog id="generate-dialog"><form method="dialog" id="generate-form"><div class="dialog-heading"><h2>生成激活码</h2><button value="cancel" aria-label="关闭">×</button></div><label>生成数量<input id="generate-count" type="number" min="1" max="500" value="1" required /></label><label>卡类型<select id="generate-type"><option value="TRIAL">体验卡（3天）</option><option value="MONTH" selected>月卡（30天）</option><option value="YEAR">年卡（365天）</option><option value="PERMANENT">永久卡（99年）</option><option value="CUSTOM">自定义卡</option></select></label><label id="valid-days-field" class="hidden-field">有效天数<input id="generate-days" type="number" min="1" max="36500" value="30" /></label><label>备注<textarea id="generate-remark" rows="3" placeholder="可选"></textarea></label><div class="dialog-actions"><button value="cancel" class="ghost-button">取消</button><button id="submit-generate" value="default" class="primary-button">确定生成</button></div></form></dialog>
    <dialog id="expires-dialog"><form method="dialog" id="expires-form"><div class="dialog-heading"><h2>修改到期时间</h2><button value="cancel" aria-label="关闭">×</button></div><label>到期时间<input id="expires-value" type="datetime-local" /></label><p class="dialog-hint">清空时间后，该激活码将按永久有效处理。</p><div class="dialog-actions"><button value="cancel" class="ghost-button">取消</button><button id="submit-expires" value="default" class="primary-button">保存</button></div></form></dialog>

    <footer class="site-footer"><span>Built for the edge</span><span class="footer-line"></span><span>© 2026 绘梦后台</span></footer>
    <script src="./script.js"></script>
  </body>
</html>
