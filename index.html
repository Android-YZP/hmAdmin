<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta
      name="description"
      content="一个简洁的 Cloudflare Worker 部署控制台"
    />
    <title>Deploy Kit · Cloudflare Worker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-orange"></div>
    <div class="ambient ambient-blue"></div>

    <header class="site-header">
      <a class="brand" href="./" aria-label="Deploy Kit 首页">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>deploy<span class="brand-dot">.</span>kit</span>
      </a>
      <div class="header-status"><span class="status-dot"></span> Worker ready</div>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow"><span></span> CLOUDFLARE WORKER TOOLKIT</div>
        <h1 id="page-title">把想法，部署到<br /><em>云端边缘。</em></h1>
        <p class="hero-copy">
          一个为 Cloudflare Worker 准备的轻量起点。<br />连接代码，点击部署，剩下的交给网络。
        </p>
      </section>

      <section class="deploy-card" aria-labelledby="deploy-title">
        <div class="card-heading">
          <div>
            <div class="card-kicker">QUICK START <span>01</span></div>
            <h2 id="deploy-title">开始一个新项目</h2>
          </div>
          <div class="sparkle" aria-hidden="true">✦</div>
        </div>
        <p class="card-subtitle">选择代码来源，或者从一个干净的模板开始。</p>

        <div class="action-grid">
          <button class="action-card" data-action="github" type="button">
            <span class="icon-box icon-github" aria-hidden="true">◉</span>
            <span class="action-copy"><strong>连接 GitHub</strong><small>从仓库导入项目</small></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </button>
          <button class="action-card" data-action="gitlab" type="button">
            <span class="icon-box icon-gitlab" aria-hidden="true">◆</span>
            <span class="action-copy"><strong>连接 GitLab</strong><small>从仓库导入项目</small></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </button>
        </div>

        <button class="wide-action" data-action="hello" type="button">
          <span class="icon-box icon-globe" aria-hidden="true">◎</span>
          <span class="action-copy"><strong>从 Hello World 开始</strong><small>立即查看一个 Worker 示例</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
        <button class="wide-action" data-action="template" type="button">
          <span class="icon-box icon-template" aria-hidden="true">◈</span>
          <span class="action-copy"><strong>选择模板</strong><small>从常用场景快速起步</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>

        <div class="upload-zone" data-action="upload" role="button" tabindex="0">
          <input id="file-upload" type="file" multiple hidden />
          <span class="icon-box icon-upload" aria-hidden="true">↑</span>
          <span class="action-copy"><strong>上传静态文件</strong><small>拖拽 HTML、CSS 或 JS 文件到这里</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </div>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </section>

      <section class="feature-row" aria-label="产品特点">
        <div><span>01</span><strong>Edge native</strong><small>为边缘网络而生</small></div>
        <div><span>02</span><strong>Zero setup</strong><small>无需复杂配置</small></div>
        <div><span>03</span><strong>Ship fast</strong><small>从想法到上线</small></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Built for the edge</span>
      <span class="footer-line"></span>
      <span>© 2026 Deploy Kit</span>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
